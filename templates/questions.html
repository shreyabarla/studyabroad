<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="../static/styles.css">
    <title>Study Abroad Recommendation</title>
</head>
<body>
    <div class="container">
    <h1>Study Abroad Recommendation Form</h1>

    <form action="/generate-report" method="POST">
        <label>Full Name</label><br/>
        <input type="text" name="name"
        required>

        <br/>
        <label>Mobile Number</label><br/>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter 10-digit phone number"
            maxlength="10"
            pattern="[0-9]{10}"
            required
        >

        <br/>
        <label>Email ID</label><br/>
        <input type="email" name="email" placeholder="Enter your Email"
        required
        >

        <br/>
        <label>Preferred Destination</label><br/>

        <select name="destination">
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="Germany">Germany</option>
        </select>

        <br/>
        <label>Education</label><br/>

        <select name="education">
            <option>Select</option>
            <option>12th Grade</option>
            <option>Bachelor's Degree</option>
            <option>Diploma</option>
        </select>

        <br/>
        <label>CGPA</label><br/>
        <input
            type="text"
            name="cgpa"
            placeholder="Enter your CGPA"
            required
        >

        <br/>
        <label>Preferred Study Field</label><br/>

        <select name="field">
            <option>Select</option>
            <option>Engineering</option>
            <option>Medical</option>
            <option>Business & Management</option>
            <option>Finance</option>
        </select>

        <br/>
        <label>Budget</label><br/>

        <select name="budget" required>
            <option value="">Select</option>
            <option value="Low">Below ₹10 Lakhs</option>
            <option value="Medium">₹10 - ₹20 Lakhs</option>
            <option value="High">Above ₹20 Lakhs</option>
        </select>

        <br/>
        
        <div class="radio-group">

            <label>Need Scholarship?</label>

            <div class="options">

                <label>
                    <input type="radio" name="scholarship" value="yes">
                    Yes
                </label>

                <label>
                    <input type="radio" name="scholarship" value="no">
                    No
                </label>

            </div>

        </div>

        <br/>
        <div class="radio-group">

            <label>Need PR Opportunities?</label>

            <div class="options">

                <label>
                    <input type="radio" name="pr" value="yes">
                    Yes
                </label>

                <label>
                    <input type="radio" name="pr" value="no">
                    No
                </label>

            </div>

        </div>

        <br/>
        <label>Importance of Part Time Jobs</label><br/>
        <select name="part_time">
            <option>Select</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
        </select>

        <br/>
        <label>IELTS Score</label>
        <input
            type="number"
            name="ielts"
            step="0.5"
            min="0"
            max="9"
            placeholder="e.g. 7.5"
            required
        >

        <br/>
        <label>Maximum Annual Tuition Budget</label><br/>
        <input
            type="text"
            name="tuition_budget"
            placeholder="Enter your budget"
            required
        >

        <br/>
        <br/>
        <button type="submit">
            Generate Report
        </button>

        <br><br>

        <a href="/view-reports">
            <button type="button">
                View Previous Reports
            </button>
        </a>

    </form>
    </div>
</body>
</html>
